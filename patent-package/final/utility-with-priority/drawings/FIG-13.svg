<text x="60" y="770" font-family="Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="start" fill="#000">A one-off read outside the loop escalates immediately; a model error escalates immediately;</text>
<text x="60" y="782" font-family="Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="start" fill="#000">a successful response with no content is a retriable model failure, not an unreadable frame.</text>
<text x="60" y="800" font-family="Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="start" fill="#000">Alternative embodiment: a sliding window over the most recent frames (a first number of the</text>
<text x="60" y="812" font-family="Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="start" fill="#000">last second number of frames unreadable) in place of the consecutive count.</text>
<text x="408" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">FIG. 13</text>
