<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 816 1056">
  <title>FIG. 5 - Tenant-governed data-egress and screenshot-retention governance 500</title>
  <desc>Black-and-white block diagram. Reference numerals 500-532.</desc>
  <style>
    .b { fill: none; stroke: #000; stroke-width: 1.5; }
    .bd { fill: none; stroke: #000; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .l { fill: none; stroke: #000; stroke-width: 1.5; }
    .ld { fill: none; stroke: #000; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .t { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #000; }
    .n { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #000; }
    .h { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #000; }
    .f { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; fill: #000; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>

  <text x="72" y="60" class="h">GOVERNANCE ARRANGEMENT 500</text>

  <!-- admin 502 (stick figure) -->
  <circle cx="110" cy="112" r="12" class="b"/>
  <line x1="110" y1="124" x2="110" y2="160" class="l"/>
  <line x1="92" y1="138" x2="128" y2="138" class="l"/>
  <line x1="110" y1="160" x2="96" y2="184" class="l"/>
  <line x1="110" y1="160" x2="124" y2="184" class="l"/>
  <text x="70" y="204" class="t">TENANT ADMIN</text>
  <text x="100" y="218" class="n">502</text>
  <path d="M 130 140 L 190 140" class="l" marker-end="url(#a)"/>

  <!-- policy editor 504 -->
  <rect x="190" y="110" width="150" height="60" class="b"/>
  <text x="198" y="128" class="t">POLICY EDITOR / WIZARD</text>
  <text x="198" y="142" class="t">(framework + regional</text>
  <text x="198" y="156" class="t">presets) <tspan class="n">504</tspan></text>
  <path d="M 340 140 L 380 140" class="l" marker-end="url(#a)"/>

  <!-- policy object 506 -->
  <rect x="380" y="90" width="380" height="250" class="b"/>
  <text x="390" y="108" class="h">EGRESS POLICY OBJECT 506 (versioned; updatedBy)</text>
  <rect x="392" y="118" width="170" height="40" class="b"/>
  <text x="398" y="134" class="t">PER-CATEGORY ACTION: send /</text>
  <text x="398" y="148" class="t">redact / withhold / tokenize <tspan class="n">508</tspan></text>
  <rect x="574" y="118" width="176" height="40" class="b"/>
  <text x="580" y="134" class="t">BLOCK WORDS (always</text>
  <text x="580" y="148" class="t">removed, never reversible) <tspan class="n">510</tspan></text>
  <rect x="392" y="168" width="170" height="40" class="b"/>
  <text x="398" y="184" class="t">MODE: redact | tokenize</text>
  <text x="398" y="198" class="n">512</text>
  <rect x="574" y="168" width="176" height="40" class="b"/>
  <text x="580" y="184" class="t">SCREENSHOT-EVIDENCE</text>
  <text x="580" y="198" class="t">RETENTION on/off <tspan class="n">514</tspan></text>
  <rect x="392" y="218" width="170" height="40" class="b"/>
  <text x="398" y="234" class="t">RETENTION WINDOW (days)</text>
  <text x="398" y="248" class="n">516</text>
  <rect x="574" y="218" width="176" height="40" class="b"/>
  <text x="580" y="234" class="t">ARMED / LOCKED state</text>
  <text x="580" y="248" class="t">(unlock = re-auth + audit) <tspan class="n">518</tspan></text>
  <rect x="392" y="268" width="358" height="40" class="b"/>
  <text x="398" y="284" class="t">CUSTOM PATTERNS with own action; applied to typed text AND to</text>
  <text x="398" y="298" class="t">OCR'd screen frames identically</text>

  <!-- scope resolution 520 -->
  <path d="M 570 340 L 570 370" class="l" marker-end="url(#a)"/>
  <rect x="380" y="370" width="380" height="70" class="b"/>
  <text x="390" y="388" class="t">SCOPE RESOLUTION: tenant member -&gt; tenant's armed policy (cannot</text>
  <text x="390" y="402" class="t">edit, weaken or opt out); individual -&gt; own policy; platform admin</text>
  <text x="390" y="416" class="t">-&gt; any policy, may lock</text>
  <text x="740" y="432" class="n">520</text>

  <!-- distribution 522 to member devices -->
  <path d="M 380 405 L 300 405 L 300 470" class="l" marker-end="url(#a)"/>
  <text x="200" y="458" class="t">522 distribute armed policy</text>

  <rect x="60" y="470" width="320" height="150" class="b"/>
  <text x="70" y="488" class="h">MEMBER USER DEVICE 110 (one of many)</text>
  <rect x="76" y="500" width="290" height="50" class="b"/>
  <text x="84" y="517" class="t">POLICY-ENFORCEMENT MODULE 128 + REDACTION</text>
  <text x="84" y="531" class="t">ENGINE 124: applied BEFORE any transmission, to</text>
  <text x="84" y="545" class="t">text and to screen frames</text>
  <rect x="76" y="560" width="290" height="46" class="bd"/>
  <text x="84" y="577" class="t">MEMBER: no self-service control; cannot weaken,</text>
  <text x="84" y="591" class="t">disable or opt out of the tenant policy <tspan class="n">532</tspan></text>

  <!-- transmission to server with re-enforcement 524 -->
  <path d="M 380 525 L 440 525" class="l" marker-end="url(#a)"/>
  <text x="384" y="516" class="t">protected</text>
  <rect x="440" y="480" width="320" height="90" class="b"/>
  <text x="450" y="498" class="h">GUIDANCE SERVER 150</text>
  <rect x="452" y="508" width="296" height="24" class="b"/>
  <text x="458" y="524" class="t">POLICY RE-ENFORCEMENT, same engine <tspan class="n">524</tspan></text>
  <rect x="452" y="538" width="296" height="24" class="b"/>
  <text x="458" y="554" class="t">evidence gated by 514; only already-redacted frames</text>

  <!-- evidence store 526 -->
  <path d="M 520 570 L 520 620" class="l" marker-end="url(#a)"/>
  <rect x="440" y="620" width="150" height="56" class="b"/>
  <text x="448" y="637" class="t">EVIDENCE STORE</text>
  <text x="448" y="651" class="t">(encrypted at rest)</text>
  <text x="448" y="666" class="n">526 (158)</text>
  <text x="536" y="600" class="t">514 = off -&gt; no frame</text>
  <text x="536" y="612" class="t">retained anywhere</text>

  <!-- audit 530 -->
  <path d="M 680 570 L 680 620" class="l" marker-end="url(#a)"/>
  <rect x="610" y="620" width="150" height="56" class="b"/>
  <text x="618" y="637" class="t">TRANSMISSION AUDIT</text>
  <text x="618" y="651" class="t">policy version, mode,</text>
  <text x="618" y="665" class="t">COUNTS not values <tspan class="n">530</tspan></text>

  <!-- retention sweep 528 -->
  <rect x="440" y="710" width="320" height="50" class="b"/>
  <text x="448" y="728" class="t">RETENTION SWEEP: delete sessions older than 516 together</text>
  <text x="448" y="742" class="t">with their evidence frames AND audit logs <tspan class="n">528</tspan></text>
  <path d="M 515 676 L 515 710" class="l" marker-end="url(#a)"/>
  <path d="M 685 676 L 685 710" class="l" marker-end="url(#a)"/>

  <!-- admin oversight 532 arrow: admin retrieves reports/audit scoped to own tenant -->
  <path d="M 60 790 L 60 880 L 790 880 L 790 648 L 760 648" class="l" marker-end="url(#a)"/>
  <path d="M 110 184 L 110 230 L 40 230 L 40 790 L 60 790" class="l"/>
  <text x="70" y="828" class="t">admin retrieves any member session report + audit, in progress or finished,</text>
  <text x="70" y="842" class="t">scoped strictly to own tenant; member PII alerts (who/what-category/count/when)</text>

  <text x="372" y="960" class="f">FIG. 5</text>
</svg>
