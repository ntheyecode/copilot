    <!-- Set <html lang>/<dir> from the chosen language BEFORE React mounts, so the
         document language is correct for assistive tech and crawlers from the first
         byte (not a static "en"), and Arabic lays out right-to-left with no flash.
         Mirrors the i18n resolver's priority: ?lang= wins, else the saved choice. -->
    <script>
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('lang');
          var ls = null; try { ls = localStorage.getItem('wc_locale'); } catch (e) {}
          var l = String(p || ls || 'en').trim() || 'en';
          var d = document.documentElement;
          d.lang = l;
          d.dir = /^ar(\b|-)/i.test(l) ? 'rtl' : 'ltr';
        } catch (e) { /* leave the markup default */ }
      })();
    </script>

    <!-- First-paint splash: a quiet brand spinner that lives inside #root until
         React renders over it (createRoot replaces these children). Guarantees the
         user never stares at a blank white page while the app's JS and the chosen
         language dictionary load (SUPREME RULE VIII: never a stuck blank state). -->
    <style>
      @keyframes wcspin { to { transform: rotate(360deg) } }
      #wc-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f7fb }
      #wc-splash i { width: 30px; height: 30px; border: 3px solid rgba(17,24,39,.12); border-top-color: #0b8259; border-radius: 50%; animation: wcspin .7s linear infinite; display: block }
      @media (prefers-color-scheme: dark) { #wc-splash { background: #0b0f1a } #wc-splash i { border-color: rgba(255,255,255,.14); border-top-color: #22c08a } }
      @media (prefers-reduced-motion: reduce) { #wc-splash i { animation-duration: 1.6s } }
    </style>
    <div id="root"><div id="wc-splash" aria-hidden="true"><i></i></div></div>
